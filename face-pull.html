<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Face Pull — reel</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Semi+Condensed:wght@500;600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root {
    --fondo:   #171614;
    --panel:   #201F1C;
    --borde:   #3A362F;
    --texto:   #F2EFE9;
    --tenue:   #8C867C;
    --amarillo:#FFD400;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--fondo);
    color: var(--texto);
    font-family: 'Barlow Semi Condensed', system-ui, sans-serif;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- pagina normal ---------- */

  .fp { padding: 20px; }

  .fp-cabecera {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 14px;
    margin-bottom: 18px;
  }

  .marca {
    font-weight: 700;
    font-size: 19px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
  }

  .sub { color: var(--tenue); font-size: 15px; }

  /* lienzo a la izquierda, guion a la derecha */
  .fp .motor-mesa {
    display: grid;
    grid-template-columns: min(440px, calc((100vh - 150px) * 0.5625)) minmax(280px, 640px);
    grid-template-rows: auto auto 1fr;
    column-gap: 28px;
    align-items: start;
  }
  .fp .motor-marco {
    grid-column: 1; grid-row: 1;
    box-shadow: 0 26px 60px rgba(0, 0, 0, 0.72);
  }
  .fp .motor-controles { grid-column: 1; grid-row: 2; }
  .fp .guion { grid-column: 2; grid-row: 1 / span 3; }

  .motor-controles {
    display: flex;
    align-items: center;
    gap: 12px;
    padding-top: 14px;
  }

  .motor-play {
    background: var(--panel);
    color: var(--texto);
    border: 1px solid var(--borde);
    border-radius: 9px;
    width: 52px;
    padding: 11px 0;
    font-size: 14px;
    cursor: pointer;
  }

  .motor-scrub {
    flex: 1;
    appearance: none;
    -webkit-appearance: none;
    height: 6px;
    border-radius: 9px;
    background: var(--borde);
    outline: none;
  }
  .motor-scrub::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--amarillo);
    cursor: grab;
    border: 0;
  }
  .motor-scrub::-moz-range-thumb {
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--amarillo);
    cursor: grab;
    border: 0;
  }

  .motor-tiempo {
    font-family: 'Courier Prime', monospace;
    font-size: 14px;
    color: var(--tenue);
    min-width: 104px;
    text-align: right;
  }

  /* ---------- guion ---------- */

  .guion {
    background: var(--panel);
    border: 1px solid var(--borde);
    border-radius: 9px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .rotulo {
    color: var(--tenue);
    font-size: 13px;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    font-weight: 600;
  }

  .ahora {
    font-size: 24px;
    line-height: 1.3;
    font-weight: 600;
    min-height: 3.9em;
  }

  .total {
    font-family: 'Courier Prime', monospace;
    font-size: 14px;
    color: var(--tenue);
  }

  .guion ol {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 1px;
    background: var(--borde);
    border: 1px solid var(--borde);
    border-radius: 9px;
    overflow: hidden;
  }

  .guion li {
    display: grid;
    grid-template-columns: 26px 1fr auto;
    gap: 12px;
    align-items: start;
    padding: 10px 12px;
    background: var(--fondo);
    cursor: pointer;
  }
  .guion li.activa { background: #2A2720; box-shadow: inset 3px 0 0 var(--amarillo); }

  .num {
    font-family: 'Courier Prime', monospace;
    color: var(--tenue);
    padding-top: 2px;
  }

  .texto { display: flex; flex-direction: column; gap: 2px; line-height: 1.35; }
  .texto b { font-weight: 700; letter-spacing: 1px; text-transform: uppercase; font-size: 14px; }
  .texto span { color: var(--tenue); font-size: 15px; }
  li.activa .texto span { color: var(--texto); }

  .seg { display: flex; align-items: center; gap: 4px; color: var(--tenue); font-size: 14px; }
  .seg input {
    width: 62px;
    background: var(--panel);
    color: var(--texto);
    border: 1px solid var(--borde);
    border-radius: 9px;
    padding: 6px 8px;
    font-family: inherit;
    font-size: 15px;
  }

  .plano {
    align-self: flex-start;
    background: transparent;
    color: var(--tenue);
    border: 1px solid var(--borde);
    border-radius: 9px;
    padding: 10px 14px;
    font-family: inherit;
    font-weight: 700;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    font-size: 14px;
    cursor: pointer;
  }
  .plano:hover { color: var(--texto); }

  @media (max-width: 820px) {
    .fp .motor-mesa { grid-template-columns: 1fr; }
    .fp .motor-marco { max-width: 440px; }
    .fp .guion { grid-column: 1; grid-row: auto; margin-top: 18px; }
  }

  /* ---------- #render: solo el lienzo, a tamano real ---------- */

  .fp-render .motor-mesa { width: 1080px; }
  .fp-render .motor-marco { border-radius: 0 !important; }
  .fp-render .motor-controles { display: none; }
</style>
</head>
<body>
  <div id="root"></div>

  <!-- sin crossorigin: asi cargan tambien con doble clic (file://) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>

  <!-- cuerpo.js y face-pull.js los genera compilar.js desde los .jsx -->
  <script src="motor.js"></script>
  <script src="primitivas.js"></script>
  <script src="cuerpo.js"></script>
  <script src="face-pull.js"></script>

  <script>
    setTimeout(function () {
      var root = document.getElementById('root');
      if (root && root.children.length === 0) {
        root.innerHTML = '<p style="padding:24px;color:#8C867C">' +
          (typeof React === 'undefined'
            ? 'No se pudo cargar React: revisá la conexión a internet.'
            : 'Falta algún archivo: motor.js, primitivas.js, cuerpo.js y face-pull.js ' +
              'tienen que estar en la misma carpeta que face-pull.html.') + '</p>';
      }
    }, 2500);
  </script>
</body>
</html>
