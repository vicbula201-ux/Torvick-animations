<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Videos largos — Torvick</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:ital,wght@0,800;0,900;1,800;1,900&family=Barlow+Semi+Condensed:wght@500;600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root {
    --fondo:   #171614;
    --panel:   #201F1C;
    --borde:   #3A362F;
    --texto:   #F2EFE9;
    --tenue:   #8C867C;
    --amarillo:#FFD400;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--fondo);
    color: var(--texto);
    font-family: 'Barlow Semi Condensed', system-ui, sans-serif;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
  }

  .largo { padding: 20px; max-width: 1280px; margin: 0 auto; }

  .largo-cabecera {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 14px;
    margin-bottom: 18px;
  }

  .marca {
    font-weight: 700;
    font-size: 19px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
  }

  .sub { color: var(--tenue); font-size: 15px; }

  .videos { display: flex; flex-wrap: wrap; gap: 6px; }
  .videos a {
    color: var(--tenue);
    text-decoration: none;
    border: 1px solid var(--borde);
    border-radius: 9px;
    padding: 6px 12px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-size: 14px;
  }
  .videos a:hover { color: var(--texto); }
  .videos a.actual { color: #14110F; background: var(--amarillo); border-color: var(--amarillo); }

  .largo-marco {
    border-radius: 9px;
    background: #14110F;
    box-shadow: 0 26px 60px rgba(0, 0, 0, 0.72);
  }

  .largo-controles {
    display: flex;
    align-items: center;
    gap: 12px;
    padding-top: 14px;
  }

  .largo-play {
    background: var(--panel);
    color: var(--texto);
    border: 1px solid var(--borde);
    border-radius: 9px;
    width: 52px;
    padding: 11px 0;
    font-size: 14px;
    cursor: pointer;
  }

  /* linea de tiempo: en amarillo las escenas, en rojo los capitulos */
  .largo-linea {
    flex: 1;
    position: relative;
    height: 22px;
    border-radius: 9px;
    background: var(--borde);
    cursor: pointer;
    overflow: hidden;
  }
  .largo-linea .marca { position: absolute; top: 4px; bottom: 4px; background: var(--amarillo); opacity: 0.75; border-radius: 3px; }
  .largo-linea .marca.cap { background: #E03A2F; opacity: 1; }
  .largo-linea .cursor { position: absolute; top: 0; bottom: 0; width: 3px; margin-left: -1px; background: var(--texto); }

  .largo-tiempo {
    font-family: 'Courier Prime', monospace;
    font-size: 14px;
    color: var(--tenue);
    min-width: 120px;
    text-align: right;
  }

  .largo-dice {
    margin-top: 14px;
    background: var(--panel);
    border: 1px solid var(--borde);
    border-radius: 9px;
    padding: 14px 18px;
    font-size: 22px;
    font-weight: 600;
    line-height: 1.3;
    min-height: 3.2em;
  }
</style>
</head>
<body>
  <div id="root"></div>

  <!-- sin crossorigin: asi cargan tambien con doble clic (file://) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>

  <!-- todos los .js los genera compilar.js desde los .jsx -->
  <script src="motor.js"></script>
  <script src="primitivas.js"></script>
  <script src="marca.js"></script>
  <script src="largos/stickers.js"></script>
  <script src="largo.js"></script>
  <script src="largo-plantillas.js"></script>

  <!-- un video = una carpeta: transcripcion.js (la escribe herramientas/transcribir.py) + plan.js -->
  <script src="largos/disciplina/transcripcion.js"></script>
  <script src="largos/disciplina/plan.js"></script>

  <script>
    if (window.LARGOS) window.LARGOS.montar();
    setTimeout(function () {
      var root = document.getElementById('root');
      if (root && root.children.length === 0) {
        root.innerHTML = '<p style="padding:24px;color:#8C867C">' +
          (typeof React === 'undefined'
            ? 'No se pudo cargar React: revisá la conexión a internet.'
            : 'Falta algún archivo .js: tienen que estar todos en la misma carpeta que largo.html.') + '</p>';
      }
    }, 2500);
  </script>
</body>
</html>
