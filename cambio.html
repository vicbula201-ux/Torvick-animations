<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cambio Físico — Torvick</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Inter+Tight:ital,wght@0,600;0,700;0,800;0,900;1,800&family=Permanent+Marker&display=swap" rel="stylesheet">

<style>
  :root {
    --fondo:   #171614;
    --panel:   #201F1C;
    --borde:   #3A362F;
    --texto:   #F2EFE9;
    --tenue:   #8C867C;
    --amarillo:#FFD400;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--fondo);
    color: var(--texto);
    font-family: 'Barlow Semi Condensed', system-ui, sans-serif;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
  }

  .cambio { padding: 20px; max-width: 1280px; margin: 0 auto; }

  .cambio-cabecera {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 14px;
    margin-bottom: 18px;
  }

  .marca {
    font-weight: 700;
    font-size: 19px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
  }

  .sub { color: var(--tenue); font-size: 15px; }

  .videos { display: flex; flex-wrap: wrap; gap: 6px; }
  .videos a {
    color: var(--tenue);
    text-decoration: none;
    border: 1px solid var(--borde);
    border-radius: 9px;
    padding: 6px 12px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-size: 14px;
  }
  .videos a:hover { color: var(--texto); }
  .videos a.actual { color: #14110F; background: var(--amarillo); border-color: var(--amarillo); }

  /* el lienzo vertical a la izquierda, los controles y el plan a la derecha */
  .cambio-mesa { display: flex; gap: 22px; align-items: flex-start; flex-wrap: wrap; }

  .cambio-marco {
    width: min(420px, calc((100vh - 120px) * 9 / 16));
    flex: none;
    border-radius: 14px;
    background: #14110F;
    box-shadow: 0 26px 60px rgba(0, 0, 0, 0.72);
  }

  .cambio-lado { flex: 1; min-width: 300px; }

  .cambio-controles { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

  .cambio-play {
    background: var(--panel);
    color: var(--texto);
    border: 1px solid var(--borde);
    border-radius: 9px;
    width: 52px;
    padding: 11px 0;
    font-size: 14px;
    cursor: pointer;
  }

  .cambio-tiempo { font-family: 'Courier Prime', monospace; font-size: 14px; color: var(--tenue); }

  .cambio-zonas { color: var(--tenue); font-size: 15px; cursor: pointer; user-select: none; }

  /* linea de tiempo: amarillo lo que entra, rojo la apertura y los capitulos */
  .cambio-linea {
    position: relative;
    height: 22px;
    margin-top: 14px;
    border-radius: 9px;
    background: var(--borde);
    cursor: pointer;
    overflow: hidden;
  }
  .cambio-linea .marca { position: absolute; top: 4px; bottom: 4px; background: var(--amarillo); opacity: 0.6; border-radius: 3px; }
  .cambio-linea .marca.cap { background: #E03A2F; opacity: 1; }
  .cambio-linea .cursor { position: absolute; top: 0; bottom: 0; width: 3px; margin-left: -1px; background: var(--texto); }

  .cambio-dice {
    margin-top: 14px;
    background: var(--panel);
    border: 1px solid var(--borde);
    border-radius: 9px;
    padding: 14px 18px;
    font-size: 22px;
    font-weight: 600;
    line-height: 1.3;
    min-height: 3.2em;
  }

  .cambio-beats {
    margin: 14px 0 0;
    padding: 0;
    list-style: none;
    max-height: calc(100vh - 330px);
    overflow: auto;
    border: 1px solid var(--borde);
    border-radius: 9px;
  }
  .cambio-beats li {
    padding: 7px 12px;
    border-bottom: 1px solid var(--borde);
    color: var(--tenue);
    cursor: pointer;
    font-size: 16px;
  }
  .cambio-beats li:last-child { border-bottom: none; }
  .cambio-beats li b { color: var(--texto); font-weight: 600; letter-spacing: 0.5px; }
  .cambio-beats li.on { background: var(--panel); color: var(--texto); }
  .cambio-beats li.on b { color: var(--amarillo); }
  .cambio-beats .t { font-family: 'Courier Prime', monospace; font-size: 13px; }
</style>
</head>
<body>
  <div id="root"></div>

  <!-- sin crossorigin: asi cargan tambien con doble clic (file://) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>

  <!-- todos los .js los genera compilar.js desde los .jsx -->
  <script src="motor.js"></script>
  <script src="primitivas.js"></script>
  <script src="cambio.js"></script>

  <!-- la lista de videos para los botones de arriba (la mantiene el autor del plan) -->
  <script src="cambios/lista.js"></script>

  <!-- un video = una carpeta cambios/<id>/: transcripcion.js (herramientas/transcribir.py) + plan.js.
       Se cargan solos segun el #id de la direccion: no hace falta anotar nada aca. -->
  <script>
    (function () {
      var lista = window.CAMBIOS_LISTA || [];
      var id = String(location.hash || '').replace(/^#/, '').split('/')[0] || (lista[0] && lista[0].id);
      var cargar = function (src) {
        return new Promise(function (listo) {
          var s = document.createElement('script');
          s.src = src;
          s.onload = listo;
          s.onerror = function () { console.warn('no carga', src); listo(); };
          document.body.appendChild(s);
        });
      };
      var montar = function () { if (window.CAMBIOS) window.CAMBIOS.montar(); };
      if (!id) { montar(); return; }
      cargar('cambios/' + id + '/transcripcion.js').then(function () { return cargar('cambios/' + id + '/plan.js'); }).then(montar);
      // otro video: se recarga la pagina para traer sus archivos
      window.addEventListener('hashchange', function () {
        var nuevo = String(location.hash || '').replace(/^#/, '').split('/')[0];
        if (nuevo && nuevo !== id) location.reload();
      });
    })();
    setTimeout(function () {
      var root = document.getElementById('root');
      if (root && root.children.length === 0) {
        root.innerHTML = '<p style="padding:24px;color:#8C867C">' +
          (typeof React === 'undefined'
            ? 'No se pudo cargar React: revisá la conexión a internet.'
            : 'Falta algún archivo .js: tienen que estar todos en la misma carpeta que cambio.html.') + '</p>';
      }
    }, 2500);
  </script>
</body>
</html>
